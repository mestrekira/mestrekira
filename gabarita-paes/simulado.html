<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulado Oficial PAES UEMA | Gabarita PAES</title>
  <link rel="stylesheet" href="css/gabarita.css">
</head>
<body>

  <header class="header">
    <a href="simulado.html" class="brand">🎓 Gabarita PAES</a>
    <nav class="nav-links">
      <a href="simulado.html" class="active">Simulado (60Q)</a>
      <a href="redacao.html">Redação UEMA</a>
      <a href="ranking.html">Classificação</a>
    </nav>
    <!-- Menu Perfil / Sair -->
    <div id="user-menu" style="display: flex; align-items: center; gap: 0.75rem;">
      <span id="user-name" style="font-weight: 600; font-size: 0.9rem; color: var(--text-main);">Aluno</span>
      <button onclick="window.api.logout()" class="btn btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.85rem;">Sair</button>
    </div>
  </header>

  <main class="container">
    <!-- Barra de Progresso Geral -->
    <div class="progress-box">
      <div class="progress-header">
        <span id="cycle-title">Carregando simulado...</span>
        <span id="progress-text">0 de 60 respondidas</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <!-- Filtros de Disciplinas Alinhados com o Gabarita PAES -->
    <div class="filter-scroll" id="disciplines-filter">
      <button class="filter-btn active" data-discipline="">Todas as 60 Questões</button>
      <button class="filter-btn" data-discipline="Língua Portuguesa e Literatura">Língua Portuguesa e Literatura</button>
      <button class="filter-btn" data-discipline="História">História</button>
      <button class="filter-btn" data-discipline="Geografia">Geografia</button>
      <button class="filter-btn" data-discipline="Filosofia e Sociologia">Filosofia e Sociologia</button>
      <button class="filter-btn" data-discipline="Biologia">Biologia</button>
      <button class="filter-btn" data-discipline="Física">Física</button>
      <button class="filter-btn" data-discipline="Química">Química</button>
      <button class="filter-btn" data-discipline="Matemática">Matemática</button>
    </div>

    <!-- Área de Renderização das Questões -->
    <div id="questions-container">
      <div class="card" style="text-align: center; color: var(--text-muted);">
        Carregando as questões do ciclo...
      </div>
    </div>
  </main>

  <!-- Carrega primeiro a API e depois a lógica do simulado sem depender de import -->
  <script src="js/api.js"></script>
  <script src="js/simulado.js"></script>
</body>
</html>
