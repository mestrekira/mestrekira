<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Gabarita PAES</title>
  <link rel="stylesheet" href="css/gabarita.css">
  <style>
    .auth-card {
      max-width: 440px;
      margin: 4rem auto;
      padding: 2.5rem 2rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="simulado.html" class="brand">🎓 Gabarita PAES</a>
  </header>

  <main class="container">
    <div class="card auth-card">
      <h2 style="text-align: center; margin-bottom: 0.5rem;">Acesse sua Conta</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">
        Entre para continuar seus simulados e redações
      </p>

      <div id="alert-box" style="display: none; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem;"></div>

      <form id="form-login">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-control" required placeholder="seuemail@exemplo.com">
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" class="form-control" required placeholder="Sua senha">
        </div>

        <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
          Entrar na Plataforma
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Ainda não tem conta? <a href="cadastro.html" style="color: var(--primary); font-weight: 600;">Cadastre-se</a>
      </p>
    </div>
  </main>

  <!-- Carrega primeiro a API e depois o script de login -->
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
