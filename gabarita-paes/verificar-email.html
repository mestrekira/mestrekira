<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificação de e-mail | Gabarita PAES</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../logo1.png">
  <link rel="stylesheet" href="auth-pages.css">
</head>
<body data-page="verify">
  <header class="site-header"><a href="index.html">Gabarita <strong>PAES</strong></a>
    <nav class="auth-nav" aria-label="Seções do Gabarita PAES"><a href="index.html">Início</a><a href="simulado.html">Simulado (60Q)</a><a href="treino-enem.html">Treino ENEM</a><a href="redacao.html">Redação UEMA</a><a href="ranking.html">Classificação</a><a href="perfil.html">Meu Perfil</a></nav>
  </header>
  <main class="auth-card">
    <p class="eyebrow">Sua conta</p>
    <h1>Verificação de e-mail</h1>
    <p id="message" class="status" role="status" aria-live="polite">Confira o resultado da verificação.</p>
    <form id="auth-form" hidden>
      <label for="email">Enviar novo link de verificação</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="seu@email.com">
      <button type="submit">Reenviar link</button>
    </form>
    <a class="secondary-link" href="login.html">Voltar ao login</a>
  </main>
  <script src="auth-pages.js" defer></script>
</body>
</html>
