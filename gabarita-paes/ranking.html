<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificação por Curso | Gabarita PAES</title>
  <link rel="stylesheet" href="css/gabarita.css">
</head>
<body>

  <header class="header">
    <a href="simulado.html" class="brand">🎓 Gabarita PAES</a>
    <nav class="nav-links">
      <a href="simulado.html">Simulado (60Q)</a>
      <a href="redacao.html">Redação UEMA</a>
      <a href="ranking.html" class="active">Classificação</a>
    </nav>
    <div id="user-menu" style="display: flex; align-items: center; gap: 0.75rem;">
      <span id="user-name" style="font-weight: 600; font-size: 0.9rem; color: var(--text-main);">Aluno</span>
      <button onclick="window.api.logout()" class="btn btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.85rem;">Sair</button>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h2 id="ranking-course">Classificação - PAES UEMA</h2>
      <p style="color: var(--text-muted); margin: 0.5rem 0 1.5rem;">
        Ranqueamento exclusivo entre candidatos do mesmo curso que concluíram as 60 questões do ciclo oficial.
      </p>

      <table class="ranking-table">
        <thead>
          <tr>
            <th>Posição</th>
            <th>Candidato</th>
            <th>Acertos (60Q)</th>
            <th>Redação (0 a 10)</th>
            <th>Nota Final</th>
          </tr>
        </thead>
        <tbody id="ranking-body">
          <tr>
            <td colspan="5" style="text-align: center; color: var(--text-muted);">Carregando classificação...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
   document.addEventListener('DOMContentLoaded', async () => {
  if (!window.api || !window.api.getToken()) {
    window.location.href = 'login.html';
    return;
  }

  // 1. Carrega o Ranking Geral (Disponível para todos os alunos)
  try {
    const generalData = await window.api.get('/rankings/general');
    renderGeneralRanking(generalData);
  } catch (err) {
    console.error('[Ranking] Erro ao carregar ranking geral:', err);
  }

  // 2. Carrega o Ranking por Curso (Exclusivo Premium — isolado com try/catch)
  try {
    const courseData = await window.api.get('/rankings/my-course');
    renderCourseRanking(courseData);
  } catch (err) {
    console.warn('[Ranking] Usuário sem acesso ao ranking por curso:', err.message);

    // Identifica o container onde a lista do curso seria exibida
    const courseContainer = 
      document.getElementById('course-ranking-table') || 
      document.getElementById('ranking-course-container') || 
      document.getElementById('ranking-curso');

    if (courseContainer) {
      courseContainer.innerHTML = `
        <div style="background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 1.5rem; text-align: center; color: #92400e; margin-top: 1rem;">
          <h4 style="margin-bottom: 0.5rem; color: #b45309;">⭐ Ranqueamento por Curso (Exclusivo Premium)</h4>
          <p style="font-size: 0.95rem; margin-bottom: 1rem;">
            A comparação direta com os candidatos do seu curso específico no PAES UEMA é reservada a assinantes.
          </p>
          <a href="assinar.html" class="btn" style="background: var(--accent); color: white; text-decoration: none; padding: 0.6rem 1.25rem; border-radius: 6px; font-weight: 600; display: inline-block;">
            Seja Premium
          </a>
        </div>
      `;
    }
  }
});
  </script>
</body>
</html>
