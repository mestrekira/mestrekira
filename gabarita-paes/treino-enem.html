<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treino Livre ENEM | Gabarita PAES</title>
  <link rel="stylesheet" href="css/gabarita.css">
  <style>
    .rec-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
    }
    .rec-item {
      display: block;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      margin-top: 0.3rem;
    }
    .rec-item:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="brand">🎓 Gabarita PAES</a>
    <nav class="nav-links">
      <a href="index.html">Início</a>
      <a href="simulado.html">Simulado (60Q)</a>
      <a href="treino-enem.html" class="active">Treino ENEM</a>
      <a href="redacao.html">Redação UEMA</a>
      <a href="ranking.html">Classificação</a>
    </nav>
    <div id="user-menu" style="display: flex; align-items: center; gap: 0.75rem;">
      <span id="user-name" style="font-weight: 600; font-size: 0.9rem; color: var(--text-main);">Aluno</span>
      <button onclick="window.api.logout()" class="btn btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.85rem;">Sair</button>
    </div>
  </header>

  <main class="container">
    
    <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h2>🎯 Treino Livre com Questões do ENEM</h2>
        <p style="color: var(--text-muted);">Pratique com questões inéditas. Suas respostas não afetam o ranking oficial do PAES UEMA.</p>
      </div>
      <button class="btn" onclick="buscarNovasQuestoes()">🔄 Gerar Novo Bloco (10Q)</button>
    </div>

    <!-- Seletor de Matéria para Treinar -->
    <div class="filter-scroll" id="disciplines-filter">
      <button class="filter-btn active" data-discipline="">Todas as Matérias</button>
      <button class="filter-btn" data-discipline="Língua Portuguesa">Língua Portuguesa</button>
      <button class="filter-btn" data-discipline="Física">Física</button>
      <button class="filter-btn" data-discipline="Química">Química</button>
      <button class="filter-btn" data-discipline="Biologia">Biologia</button>
      <button class="filter-btn" data-discipline="Matemática">Matemática</button>
      <button class="filter-btn" data-discipline="História">História</button>
       <button class="filter-btn" data-discipline="Filosofia e Sociologia">Filosofia e Sociologia</button>
      <button class="filter-btn" data-discipline="Geografia">Geografia</button>
    </div>

    <!-- Container das Questões de Treino -->
    <div id="practice-container">
      <div class="card" style="text-align: center; color: var(--text-muted);">
        Carregando bloco de questões inéditas...
      </div>
    </div>

  </main>

  <script src="js/api.js"></script>
  <script src="js/treino-enem.js"></script>
</body>
</html>
