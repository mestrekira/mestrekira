<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova senha | Gabarita PAES</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../logo1.png">
  <link rel="stylesheet" href="auth-pages.css">
</head>
<body data-page="reset">
  <header class="site-header"><a href="index.html">Gabarita <strong>PAES</strong></a></header>
  <main class="auth-card">
    <p class="eyebrow">Acesso à conta</p>
    <h1>Definir nova senha</h1>
    <form id="auth-form">
      <label for="password">Nova senha (mínimo de 8 caracteres)</label>
      <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirm">Confirme a nova senha</label>
      <input id="confirm" name="confirm" type="password" minlength="8" autocomplete="new-password" required>
      <button type="submit">Salvar nova senha</button>
    </form>
    <p id="message" class="status" role="status" aria-live="polite" hidden></p>
    <a class="secondary-link" href="login.html">Voltar ao login</a>
  </main>
  <script src="auth-pages.js" defer></script>
</body>
</html>
