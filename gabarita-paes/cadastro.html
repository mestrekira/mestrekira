<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta | Gabarita PAES</title>
  <link rel="stylesheet" href="css/gabarita.css">
  <style>
    .auth-card {
      max-width: 520px;
      margin: 2.5rem auto;
      padding: 2.5rem 2rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      background-color: white;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="simulado.html" class="brand">🎓 Gabarita PAES</a>
  </header>

  <main class="container">
    <div class="card auth-card">
      <h2 style="text-align: center; margin-bottom: 0.5rem;">Crie sua Conta</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">
        Prepare-se para o PAES UEMA com simulados e redação
      </p>

      <div id="alert-box" style="display: none; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem;"></div>

      <form id="form-cadastro">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" class="form-control" required placeholder="Seu nome">
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-control" required placeholder="seuemail@exemplo.com">
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" class="form-control" required minlength="8" placeholder="Mínimo de 8 caracteres">
        </div>

        <!-- Lista Oficial Completa de Cursos do PAES UEMA -->
        <div class="form-group">
          <label for="curso">Curso Pretendido no PAES UEMA</label>
          <select id="curso" class="form-control" required>
            <option value="" disabled selected>Selecione seu curso oficial...</option>
            <option value="Administração Bacharelado">Administração Bacharelado</option>
            <option value="Agronomia Bacharelado">Agronomia Bacharelado</option>
            <option value="Arquitetura e Urbanismo Bacharelado">Arquitetura e Urbanismo Bacharelado</option>
            <option value="Ciências Biológicas Bacharelado">Ciências Biológicas Bacharelado</option>
            <option value="Ciências Biológicas Licenciatura">Ciências Biológicas Licenciatura</option>
            <option value="Ciências Contábeis Bacharelado">Ciências Contábeis Bacharelado</option>
            <option value="Ciências Naturais Licenciatura">Ciências Naturais Licenciatura</option>
            <option value="Ciências Sociais Bacharelado">Ciências Sociais Bacharelado</option>
            <option value="Ciências Sociais Licenciatura">Ciências Sociais Licenciatura</option>
            <option value="Curso de Formação de Oficiais – CBMMA Bacharelado em Segurança Pública do Trabalho">Curso de Formação de Oficiais – CBMMA Bacharelado em Segurança Pública do Trabalho</option>
            <option value="Curso de Formação de Oficiais - Bacharelado em Segurança Pública - PMMA">Curso de Formação de Oficiais - Bacharelado em Segurança Pública - PMMA</option>
            <option value="Curso Superior de Tecnologia em Alimentos">Curso Superior de Tecnologia em Alimentos</option>
            <option value="Curso Superior de Tecnologia em Fruticultura">Curso Superior de Tecnologia em Fruticultura</option>
            <option value="Curso Superior de Tecnologia em Gestão Ambiental">Curso Superior de Tecnologia em Gestão Ambiental</option>
            <option value="Curso Superior de Tecnologia em Gestão Comercial">Curso Superior de Tecnologia em Gestão Comercial</option>
            <option value="Curso Superior de Tecnologia em Gestão de Agronegócio">Curso Superior de Tecnologia em Gestão de Agronegócio</option>
            <option value="Direito Bacharelado">Direito Bacharelado</option>
            <option value="Educação Física Licenciatura">Educação Física Licenciatura</option>
            <option value="Enfermagem Bacharelado">Enfermagem Bacharelado</option>
            <option value="Engenharia Civil Bacharelado">Engenharia Civil Bacharelado</option>
            <option value="Engenharia da Computação Bacharelado">Engenharia da Computação Bacharelado</option>
            <option value="Engenharia de Pesca Bacharelado">Engenharia de Pesca Bacharelado</option>
            <option value="Engenharia de Produção Bacharelado">Engenharia de Produção Bacharelado</option>
            <option value="Engenharia Mecânica Bacharelado">Engenharia Mecânica Bacharelado</option>
            <option value="Filosofia Licenciatura">Filosofia Licenciatura</option>
            <option value="Física Licenciatura">Física Licenciatura</option>
            <option value="Fisioterapia Bacharelado">Fisioterapia Bacharelado</option>
            <option value="Geografia Bacharelado">Geografia Bacharelado</option>
            <option value="Geografia Licenciatura">Geografia Licenciatura</option>
            <option value="História Licenciatura">História Licenciatura</option>
            <option value="Letras Licenciatura em Língua Portuguesa e Literaturas de Língua Portuguesa">Letras Licenciatura em Língua Portuguesa e Literaturas de Língua Portuguesa</option>
            <option value="Letras Licenciatura em Língua Portuguesa Língua Espanhola e Literaturas">Letras Licenciatura em Língua Portuguesa Língua Espanhola e Literaturas</option>
            <option value="Letras Licenciatura em Língua Portuguesa Língua Inglesa e Literaturas">Letras Licenciatura em Língua Portuguesa Língua Inglesa e Literaturas</option>
            <option value="Matemática Licenciatura">Matemática Licenciatura</option>
            <option value="Medicina Bacharelado">Medicina Bacharelado</option>
            <option value="Medicina Veterinária Bacharelado">Medicina Veterinária Bacharelado</option>
            <option value="Meteorologia">Meteorologia</option>
            <option value="Música Licenciatura">Música Licenciatura</option>
            <option value="Pedagogia Licenciatura">Pedagogia Licenciatura</option>
            <option value="Psicologia Bacharelado">Psicologia Bacharelado</option>
            <option value="Química Licenciatura">Química Licenciatura</option>
            <option value="Relações Internacionais">Relações Internacionais</option>
            <option value="Zootecnia Bacharelado">Zootecnia Bacharelado</option>
          </select>
        </div>

        <!-- Opção de Língua Estrangeira -->
        <div class="form-group">
          <label for="lingua">Opção de Língua Estrangeira</label>
          <select id="lingua" class="form-control" required>
            <option value="INGLES">Língua Inglesa (Questões 12 a 16)</option>
            <option value="ESPANHOL">Língua Espanhola (Questões 17 a 21)</option>
          </select>
        </div>

        <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 1rem;">
          Cadastrar Gratuitamente
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Já tem uma conta? <a href="login.html" style="color: var(--primary); font-weight: 600;">Faça login</a>
      </p>
    </div>
  </main>

  <!-- Carrega a API global sem depender de import -->
  <script src="js/api.js"></script>
  <script>
    document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert-box');
      alertBox.style.display = 'none';

      const payload = {
        name: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        password: document.getElementById('senha').value,
        targetCourse: document.getElementById('curso').value,
        foreignLanguage: document.getElementById('lingua').value,
      };

      try {
        const res = await window.api.post('/auth/register', payload);
        alertBox.style.display = 'block';
        alertBox.style.background = '#dcfce7';
        alertBox.style.color = '#166534';
        alertBox.innerText = 'Conta criada com sucesso! Enviamos um link de confirmação para o seu e-mail.';
        document.getElementById('form-cadastro').reset();
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#991b1b';
        alertBox.innerText = err.message || 'Falha ao cadastrar.';
      }
    });
  </script>
</body>
</html>
