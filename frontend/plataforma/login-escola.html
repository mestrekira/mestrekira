<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso da escola | Mestre Kira</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ui-feedback.css">
  <link rel="icon" href="logo1.png" type="image/png">
</head>
<body>
  <h1>Acesso da escola</h1>
  <section aria-label="Entrar na conta da escola">
    <label for="email">E-mail da escola</label>
    <input id="email" type="email" autocomplete="email" placeholder="E-mail da escola">
    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Sua senha">
    <button id="btnLogin" type="button">Entrar</button>
    <button id="resendVerifyBtn" type="button" style="display:none">Reenviar link de verificação</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p><a href="esqueci-senha.html?role=school">Esqueci minha senha</a></p>
    <p><a href="cadastro-escola.html">Criar conta da escola</a></p>
  </section>
  <p><a href="index.html">Voltar aos acessos</a></p>
  <script type="module" src="js/login-escola.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
